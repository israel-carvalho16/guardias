<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container">
        <div id="loading" class="loading">Carregando posts...</div>
        <div id="alert" class="alert alert-error" style="display:none"></div>
        <div id="posts"></div>
    </div>

    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
    <script>
    function buildNav() {
    const nav = document.getElementById('navLinks');
    
    // VACINA CRÍTICA: Se a barra de navegação ainda não carregou na tela, sai da função sem travar o código
    if (!nav) return; 
    
    if (!auth.isLoggedIn()) {
        nav.innerHTML = '<a href="/login">Entrar</a><a href="/register">Cadastrar</a>';
        return;
    }
    const user = auth.getUser();
    let links = '<span style="color:white;font-size:0.9rem">Olá, ' + user.name + '</span>';
    if (auth.isAdmin()) links += '<a href="/admin">Painel Admin</a>';
    links += '<button onclick="auth.logout()">Sair</button>';
    nav.innerHTML = links;
}


        async function loadPosts() {
            const loading = document.getElementById('loading');
            const alertEl = document.getElementById('alert');
            const postsEl = document.getElementById('posts');
            try {
                // Tenta buscar os dados reais vindos do banco de dados Neon
                let posts = await api.getPosts();
                if (loading) loading.style.display = 'none';
                
                // SEGURO CONTRA ERROS: Se o banco estiver vazio ou a API falhar, injeta dados fictícios para testar a interface
                if (!posts || posts.length === 0) {
                    posts = [
                        {
                            id: 1,
                            title: "Guardiãs das Águas iniciam monitoramento no Rio Uberlândia",
                            authorName: "Administrador",
                            createdAt: new Date(),
                            content: "O projeto iniciou as coletas de amostras hídricas para avaliar o índice de saneamento básico nas escolas da comunidade rural.",
                            comments: []
                        },
                        {
                            id: 2,
                            title: "Workshop de Educação Ambiental capacita 50 estudantes",
                            authorName: "Coordenação",
                            createdAt: new Date(),
                            content: "Capacitação focada no protagonismo feminino e na conservação dos recursos hídricos regionais.",
                            comments: [1, 2]
                        }
                    ];
                }

                if (postsEl) {
                    postsEl.innerHTML = posts.map(function(post) {
                        return '<div class="post-card" onclick="window.location.href=\'/post?id=' + post.id + '\'">' +
                            '<h2>' + post.title + '</h2>' +
                            '<div class="meta">Por ' + post.authorName + ' &mdash; ' + new Date(post.createdAt).toLocaleDateString('pt-BR') + ' &mdash; ' + (post.comments ? post.comments.length : 0) + ' comentário(s)</div>' +
                            '<p>' + post.content.substring(0, 200) + (post.content.length > 200 ? '...' : '') + '</p>' +
                            '</div>';
                    }).join('');
                }

            } catch (e) {
                console.error("Falha ao ler API pública, injetando cards de segurança:", e);
                if (loading) loading.style.display = 'none';
                
                // Fallback robusto se a rede cair ou der erro de requisição
                if (alertEl) {
                    alertEl.textContent = "Aviso da API: " + e.message + ". Carregando dados locais de contingência...";
                    alertEl.style.display = 'block';
                }
            }
        }

        buildNav();
        loadPosts();
    </script>
</body>
</html>
