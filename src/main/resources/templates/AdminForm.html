<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Administrador - Guardiãs das Águas</title>
    
    <!-- Link para o FontAwesome (Para o ícone de voltar) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Arquivo CSS Único para o Formulário -->
    <link rel="stylesheet" href="/src/main/resources/static/css/admin.css">
    <link rel="stylesheet" href="/src/main/resources/static/css/formularios.css">
</head>
<body>

    <!-- Link Flutuante para Voltar à Home -->
 <a href="pagina1.html" class="btn-voltar-formulario">
  <i class="fas fa-arrow-left"></i> Voltar ao Início
</a>

    <!-- Fundo abstrato moderno (Mantive as suas shapes) -->
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Container do Formulário -->
    <div class="form-container">
        
        <!-- Identidade Visual dentro do Form -->
        <div class="form-header">
            <img src="/src/main/resources/static/img/logo.png" alt="Logo Guardiãs das Águas" class="form-logo">
            <h2>Guardiãs das Águas</h2>
            <p>Portal do Administrador</p>
        </div>

        <form action="#" method="POST">
            <h3>Criar Conta</h3>
            
            <div class="input-group">
                <label for="username">Nome Completo</label>
                <input type="text" placeholder="Digite seu nome" id="username" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail Institucional</label>
                <input type="email" placeholder="nome@exemplo.com" id="email" required>
            </div>

            <div class="input-group">
                <label for="cpf">CPF</label>
                <!-- Corrigido o type para o navegador aceitar números -->
                <input type="text" placeholder="000.000.000-00" id="cpf" maxlength="14" required>
            </div>

            <div class="input-group">
                <label for="password">Senha de Acesso</label>
                <input type="password" placeholder="Crie uma senha segura" id="password" required>
            </div>

            <button type="submit" class="btn-submit">Cadastrar Administrador</button>
        </form>
    </div>

</body>
</html>
