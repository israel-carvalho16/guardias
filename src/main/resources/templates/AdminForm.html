
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Administrador - Guardiãs das Águas</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

    <a th:href="@{/}" class="btn-voltar-formulario">
        <i class="fas fa-arrow-left"></i> Voltar ao Início
    </a>

    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="form-container">
        
        <div class="form-header">
            <img th:src="@{/img/logo.png}" alt="Logo Guardiãs das Águas" class="form-logo">
            <h2>Guardiãs das Águas</h2>
            <p>Portal do Administrador</p>
        </div>
<form id="adminForm" onsubmit="enviarLoginAdmin(event)">
    
    <div id="msgErro" style="color: #ff4a4a; margin-bottom: 15px; font-weight: bold; text-align: center; display: none;">
        E-mail ou senha inválidos.
    </div>

    <div class="input-group">
        <label for="email">E-mail Institucional</label>
        <input type="email" placeholder="nome@exemplo.com" id="email" required>
    </div>

    <div class="input-group">
        <label for="senha">Senha de Acesso</label>
        <input type="password" placeholder="Digite sua senha" id="senha" required>
    </div>

    <button type="submit" class="btn-submit">Entrar no Painel</button>
</form>

<script>
    async function enviarLoginAdmin(event) {
        event.preventDefault();
        document.getElementById('msgErro').style.display = 'none';

        const dados = {
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value
        };

        try {
            const response = await fetch('/admin/login-api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (response.ok) {
                const resultado = await response.json();
                localStorage.setItem('token', resultado.token);
                window.location.href = '/admin-dashboard';
            } else {
                document.getElementById('msgErro').style.display = 'block';
            }
        } catch (err) {
            document.getElementById('msgErro').style.display = 'block';
        }
    }
</script>

</body>
</html>
