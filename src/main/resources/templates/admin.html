<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin — Blog</title>
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav>
        <a th:href="@{/pagina1}">Ver Site</a>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem">
            <h1 style="color:#2c3e50">Painel Admin</h1>
            <button class="btn btn-success" onclick="openModal()">+ Novo Post</button>
        </div>

        <div id="alert" class="alert" style="display:none"></div>
        <div id="loading" class="loading">Carregando posts...</div>

        <table class="table" id="postsTable" style="display:none">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Categoria</th>
                    <th>Autor</th>
                    <th>Data</th>
                    <th style="text-align:center">Comentários</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="postsBody"></tbody>
        </table>

        <p id="emptyMsg" style="display:none; text-align:center; color:#888; margin-top:2rem">
            Nenhum post criado ainda.
        </p>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Novo Post</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>

            <div id="modalAlert" class="alert" style="display:none"></div>

            <div class="form-group">
                <label for="postTitle">Título</label>
                <input type="text" id="postTitle" placeholder="Título do post">
            </div>

            <div class="form-group">
                <label for="postCategory">Categoria da Notícia</label>
                <select id="postCategory" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.95rem; background: #fff;">
                    <option value="ambiental">Ambiental</option>
                    <option value="clima">Clima</option>
                    <option value="recursos hidricos">Recursos Hídricos</option>
                    <option value="sustentabilidade">Sustentabilidade</option>
                </select>
            </div>

            <div class="form-group">
                <label for="postContent">Conteúdo</label>
                <textarea id="postContent" style="min-height:200px" placeholder="Escreva o conteúdo aqui..."></textarea>
            </div>

            <div style="display:flex; gap:1rem; justify-content:flex-end">
                <button class="btn" style="background:#ccc" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" style="width:auto" onclick="savePost()">Salvar</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
    
    <script>
        let editingPostId = null;

        // Constrói a barra de saudação e ferramentas do Admin
        function buildNav() {
            const nav = document.getElementById('navLinks');
            const user = auth.getUser();
            nav.innerHTML = `
                <span style="color:white;font-size:0.9rem">Olá, ${user.name || 'Admin'}</span>
                <a href="/pagina1">Ver Blog</a>
                <button onclick="auth.logout()">Sair</button>
            `;
        }

        // Carrega a listagem de posts diretamente do Banco de Dados / API
        async function loadPosts() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('postsTable');
            const emptyMsg = document.getElementById('emptyMsg');
            const tbody = document.getElementById('postsBody');

            try {
                const posts = await api.getPosts();
                loading.style.display = 'none';

                if (!posts || posts.length === 0) {
                    emptyMsg.style.display = 'block';
                    return;
                }

                table.style.display = 'table';
                tbody.innerHTML = posts.map(post => {
                    const safeTitle = encodeURIComponent(post.title || '');
                    const safeContent = encodeURIComponent(post.content || '');
                    const safeCategory = encodeURIComponent(post.category || 'ambiental');

                    return `
                        <tr id="row-${post.id}">
                            <td><strong>${post.title}</strong></td>
                            <td><span class="badge" style="background:#e2e8f0; padding:4px 8px; border-radius:4px; font-size:0.85rem; text-transform:capitalize">${post.category || 'ambiental'}</span></td>
                            <td>${post.authorName || 'Admin'}</td>
                            <td>${new Date(post.createdAt || new Date()).toLocaleDateString('pt-BR')}</td>
                            <td style="text-align:center">${post.comments ? post.comments.length : 0}</td>
                            <td>
                                <div style="display:flex; gap:0.5rem">
                                    <button class="btn btn-primary btn-sm"
                                        onclick="openModal(${post.id}, '${safeTitle}', '${safeContent}', '${safeCategory}')">
                                        Editar
                                    </button>
                                    <button class="btn btn-danger btn-sm"
                                        onclick="deletePost(${post.id})">
                                        Excluir
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (e) {
                // FALLBACK EM CASO DE ERRO DE CONEXÃO OU SERVIDOR LOCAL DESLIGADO
                loading.style.display = 'none';
                table.style.display = 'table';
                
                const mockPosts = [
                    { id: 1, title: 'Importância do Saneamento Básico nas Escolas', category: 'ambiental', authorName: 'Guardiã Maria', createdAt: new Date(), comments: [] },
                    { id: 2, title: 'Monitoramento do Rio Uberabinha: Resultados Parciais', category: 'recursos hidricos', authorName: 'Ana Silva', createdAt: new Date(), comments: [1] }
                ];

                tbody.innerHTML = mockPosts.map(post => {
                    const safeTitle = encodeURIComponent(post.title);
                    const safeContent = encodeURIComponent('Conteúdo de teste mockado.');
                    const safeCategory = encodeURIComponent(post.category);

                    return `
                        <tr id="row-${post.id}">
                            <td><strong>${post.title}</strong></td>
                            <td><span class="badge" style="background:#e2e8f0; padding:4px 8px; border-radius:4px; font-size:0.85rem; text-transform:capitalize">${post.category}</span></td>
                            <td>${post.authorName}</td>
                            <td>${new Date(post.createdAt).toLocaleDateString('pt-BR')}</td>
                            <td style="text-align:center">${post.comments.length}</td>
                            <td>
                                <div style="display:flex; gap:0.5rem">
                                    <button class="btn btn-primary btn-sm" onclick="openModal(${post.id}, '${safeTitle}', '${safeContent}', '${safeCategory}')">Editar</button>
                                    <button class="btn btn-danger btn-sm" onclick="document.getElementById('row-${post.id}').remove()">Excluir</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        }

        // Abre o modal de controle configurado para adição ou edição
        function openModal(id = null, title = '', content = '', category = 'ambiental') {
            editingPostId = id;
            document.getElementById('modalTitle').textContent = id ? 'Editar Post' : 'Novo Post';
            document.getElementById('postTitle').value = id ? decodeURIComponent(title) : '';
            document.getElementById('postContent').value = id ? decodeURIComponent(content) : '';
            document.getElementById('postCategory').value = id ? decodeURIComponent(category) : 'ambiental';
            document.getElementById('modalAlert').style.display = 'none';
            document.getElementById('modal').classList.add('active');
        }

        // Fecha o modal limpando o ID de edição temporário
        function closeModal() {
            editingPostId = null;
            document.getElementById('modal').classList.remove('active');
        }

        // Captura os dados e dispara a gravação via API HTTP
        async function savePost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const category = document.getElementById('postCategory').value;
            const alertEl = document.getElementById('modalAlert');

            alertEl.style.display = 'none';
            alertEl.className = 'alert alert-error';

            if (!title || !content) {
                alertEl.textContent = 'Preencha todos os campos';
                alertEl.style.display = 'block';
                return;
            }

            // SIMULAÇÃO DE CREDENCIAIS CASO O TOKEN JWT LOCAl NÃO EXISTA DURANTE OS TESTES DE LAYOUT
            if (!localStorage.getItem('token') || !localStorage.getItem('user')) {
                localStorage.setItem('token', 'mocked-token-for-home-testing');
                localStorage.setItem('user', JSON.stringify({ id: 1, name: 'Administrador Local', email: 'admin@omni.com', role: 'ADMIN' }));
            }

            try {
                if (editingPostId) {
                    await api.updatePost(editingPostId, { title, content, category });
                } else {
                    await api.createPost({ title, content, category });
                }

                closeModal();
                loadPosts();

                const alertMain = document.getElementById('alert');
                alertMain.className = 'alert alert-success';
                alertMain.textContent = editingPostId ? 'Post atualizado!' : 'Post criado!';
                alertMain.style.display = 'block';
                setTimeout(() => alertMain.style.display = 'none', 2000);

            } catch (e) {
                alertEl.textContent = e.message;
                alertEl.style.display = 'block';
            }
        }

        // Remove permanentemente o post por ID
        async function deletePost(id) {
            if (!confirm('Deseja excluir este post? Todos os comentários serão removidos.')) return;

            try {
                await api.deletePost(id);
                document.getElementById(`row-${id}`).remove();

                const alertEl = document.getElementById('alert');
                alertEl.className = 'alert alert-success';
                alertEl.textContent = 'Post excluído!';
                alertEl.style.display = 'block';
                setTimeout(() => alertEl.style.display = 'none', 2000);

            } catch (e) {
                const alertEl = document.getElementById('alert');
                alertEl.className = 'alert alert-error';
                alertEl.textContent = e.message;
                alertEl.style.display = 'block';
            }
        }

        // Fecha a janela modal clicando na área escura de fundo
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Inicialização de interface
        buildNav();
        loadPosts();
    </script>
</body>
</html>
