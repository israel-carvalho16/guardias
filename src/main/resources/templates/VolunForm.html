<!DOCTYPE html>
<!-- 1. DECLARAÇÃO DO THYMELEAF ATIVADA E VALIDADA -->
<html lang="pt-BR" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição de Voluntariado - Guardiãs das Águas</title>
    
    <!-- Biblioteca FontAwesome obrigatória para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 2. Arquivos CSS limpos e isolados a partir da raiz da pasta static -->
    <link rel="stylesheet" th:href="@{/css/voluntario.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
</head>
<body>

    <!-- 3. Botão de voltar ajustado para a rota correta do Controller -->
    <a th:href="@{/pagina1}" class="btn-back-home">
        <i class="fas fa-arrow-left"></i> Voltar ao Início
    </a>

    <!-- Fundo Abstrato com Esferas Fluídas de Alta UI -->
    <div class="background-circles">
        <div class="sphere circle-primary"></div>
        <div class="sphere circle-secondary"></div>
        <div class="sphere circle-accent"></div>
    </div>

    <!-- Container Principal do Formulário (Efeito de Vidro) -->
    <div class="volun-container">
        
        <!-- Identidade Visual do Projeto -->
        <div class="form-header">
            <img th:src="@{/img/logo.png}" alt="Logo Guardiãs das Águas" class="form-logo">
            <h2>Guardiãs das Águas</h2>
            <p>Faça parte do movimento</p>
        </div>
        <!-- 1. CORREÇÃO DA ROTA: th:action ajustado para passar livre pelo Spring Security em casa -->
        <form th:action="@{/api/auth/volun-form}" method="POST">
            <h3>Ficha de Inscrição</h3>
            
            <!-- Grid de Duas Colunas para os Campos -->
            <div class="form-grid">
                
                <div class="input-field">
                    <label for="volun-name">Nome Completo</label>
                    <input type="text" placeholder="Seu nome completo" id="volun-name" name="name" required>
                </div>

                <div class="input-field">
                    <label for="volun-email">E-mail</label>
                    <input type="email" placeholder="seuemail@exemplo.com" id="volun-email" name="email" required>
                </div>

                <div class="input-field">
                    <label for="volun-cpf">CPF</label>
                    <input type="text" placeholder="000.000.000-00" id="volun-cpf" name="cpf" maxlength="14" required>
                </div>

                <div class="input-field">
                    <label for="volun-phone">Telefone / WhatsApp</label>
                    <input type="tel" placeholder="(00) 00000-0000" id="volun-phone" name="phone" required>
                </div>

                <div class="input-field">
                    <label for="volun-gender">Gênero</label>
                    <select id="volun-gender" name="gender" required>
                        <option value="" disabled selected hidden>Selecione</option>
                        <option value="feminino">Feminino</option>
                        <option value="masculino">Masculino</option>
                        <option value="outro">Outro / Prefiro não dizer</option>
                    </select>
                </div>

                <div class="input-field">
                    <label for="volun-pass">Criar Senha de Acesso</label>
                    <input type="password" placeholder="Crie uma senha forte" id="volun-pass" name="password" required>
                </div>

            </div>

            <!-- Botão de Envio Sólido -->
            <button type="submit" class="btn-submit-volun">Enviar Inscrição</button>
        </form>
    </div>

</body>
</html>
